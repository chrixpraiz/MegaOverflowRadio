workflows:
  mor-capacitor:
    name: MOR Web to APK
    instance_type: mac_mini_m2
    environment:
      node: 22.13.0
      java: 21
    scripts:
      - name: Build Web + APK
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          npx cap init "Mega Overflow Radio" com.megaoverflow.radio --web-dir=dist || true
          npx cap add android || true
          npx cap copy android
          python3 << 'PY'
          import pathlib, re
          p=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t=p.read_text()
          if "INTERNET" not in t:
            t=t.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application')
          if "usesCleartextTraffic" not in t:
            t=t.replace("<application", '<application android:usesCleartextTraffic="true" ')
          p.write_text(t)
          PY
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
