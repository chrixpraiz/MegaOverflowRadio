workflows:
  flutter-android:
    name: MOR Background + Bluetooth
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Verify Assets
        script: |
          echo "=== Checking assets ==="
          [ -f assets/icon/app_icon.png ] || { echo "ERROR: assets/icon/app_icon.png missing"; exit 1; }
          [ -f assets/icon/logo.png ]    || { echo "ERROR: assets/icon/logo.png missing";    exit 1; }
          ls -lh assets/icon/
          echo "=== Assets OK ==="

      - name: Regenerate Android + Write Manifest
        script: |
          rm -rf android
          flutter create . --platforms=android \
            --project-name megaoverflowradio \
            --org com.megaoverflow \
            --template app

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>

              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="mailto"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="whatsapp"/></intent>
              </queries>

              <application
                  android:label="MegaOverflow Radio"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:enableOnBackInvokedCallback="true">

                  <meta-data android:name="flutterEmbedding" android:value="2"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService"/>
                      </intent-filter>
                  </service>

                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-1383337037822798~9185411751"/>
              </application>
          </manifest>
          XML

          echo "=== Manifest written ==="

      - name: Verify v2 Embedding
        script: |
          grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml \
            || { echo "ERROR: flutterEmbedding missing"; exit 1; }
          echo "OK: flutterEmbedding present"

          ACTIVITY=$(find android/app/src/main -name "MainActivity.kt" -o -name "MainActivity.java" | head -n1)
          [ -n "$ACTIVITY" ] || { echo "ERROR: MainActivity not found"; exit 1; }
          grep -q 'io.flutter.embedding.android.FlutterActivity' "$ACTIVITY" \
            || { echo "ERROR: MainActivity uses v1 embedding"; exit 1; }
          echo "OK: v2 MainActivity"

      - name: Get Dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Generate Launcher Icons
        script: |
          set -e
          dart run flutter_launcher_icons
          echo "=== Generated launcher icons ==="
          find android/app/src/main/res -name "ic_launcher*" -type f
          COUNT=$(find android/app/src/main/res -name "ic_launcher*" -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 4 ]; then
            echo "ERROR: expected >=4 ic_launcher PNGs, found $COUNT"
            find android/app/src/main/res -type f
            exit 1
          fi
          echo "OK: $COUNT launcher icon files generated"

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Verify APK Contents
        script: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk

          [ -f "$APK" ] || { echo "ERROR: APK not found"; exit 1; }
          echo "=== APK size ==="; ls -lh "$APK"

          echo ""
          echo "=== Assets ==="
          unzip -l "$APK" | grep -i "assets/icon" \
            || { echo "ERROR: icon assets missing"; exit 1; }

          echo ""
          echo "=== Launcher icon ==="
          unzip -l "$APK" | grep -q "mipmap.*ic_launcher" \
            || { echo "ERROR: ic_launcher missing"; unzip -l "$APK" | grep mipmap || true; exit 1; }
          echo "OK: ic_launcher bundled"

          echo ""
          echo "=== Manifest strings ==="
          unzip -p "$APK" AndroidManifest.xml > /tmp/am.bin
          FAIL=0

          strings /tmp/am.bin | grep -qi "audioservice" \
            && echo "OK: AudioService" \
            || { echo "ERROR: AudioService missing"; FAIL=1; }

          strings /tmp/am.bin | grep -qi "MediaButtonReceiver" \
            && echo "OK: MediaButtonReceiver" \
            || { echo "ERROR: MediaButtonReceiver missing"; FAIL=1; }

          strings /tmp/am.bin | grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" \
            && echo "OK: FGS_MEDIA_PLAYBACK" \
            || echo "WARN: FGS_MEDIA_PLAYBACK missing"

          strings /tmp/am.bin | grep -q "com.google.android.gms.ads.APPLICATION_ID" \
            && echo "OK: AdMob app id" \
            || { echo "ERROR: AdMob APPLICATION_ID missing"; FAIL=1; }

          [ "$FAIL" -eq 0 ] || { echo ""; echo "=== Verification FAILED ==="; exit 1; }
          echo ""
          echo "=== All APK checks passed ==="

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
