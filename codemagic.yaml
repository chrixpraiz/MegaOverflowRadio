workflows:
  flutter-android:
    name: MOR Background + Bluetooth
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    - name: Fix Manifest + Background Play
        script: |
          echo "=== Checking assets ==="
          [ -f assets/icon/app_icon.png ] || { echo "MISSING app_icon.png"; exit 1; }
          [ -f assets/icon/logo.png ]    || { echo "MISSING logo.png";    exit 1; }
          ls -lh assets/icon/          
          echo "=== Assets OK ==="

          rm -rf android
          flutter create . --platforms=android \
            --project-name megaoverflowradio \
            --org com.megaoverflow --template app

          python3 << 'PY'
          import pathlib, re

          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = m.read_text()

          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.BLUETOOTH',
              'android.permission.BLUETOOTH_CONNECT',
          ]

          perm_xml = "\n".join(
              f'    <uses-permission android:name="{p}" />' for p in perms
              if p not in txt
          )

          if perm_xml:
              txt = txt.replace("<application", perm_xml + "\n    <application", 1)

          if "usesCleartextTraffic" not in txt:
              txt = txt.replace("<application", '<application android:usesCleartextTraffic="true"', 1)

          if "com.google.android.gms.ads.APPLICATION_ID" not in txt:
              meta = (
                  '\n        <meta-data '
                  'android:name="com.google.android.gms.ads.APPLICATION_ID" '
                  'android:value="ca-app-pub-3940256099942544~3347511713"/>'
              )
              txt = re.sub(
                  r'(<application[^>]*>)',
                  r'\1' + meta,
                  txt,
                  count=1,
              )

          m.write_text(txt)
          print("=== Manifest patched ===")
          print(m.read_text())
          PY

      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release

      - name: Verify assets in APK
        script: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i "assets/icon" || {
            echo "ERROR: icons not bundled in APK!"
            exit 1
          }

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
