workflows:
  flutter-android:
    name: Full 12 Tabs
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix & Build
        script: |
          rm -rf android
          flutter create. --platforms=android --project-name megaoverflowradio --org com.megaoverflow
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
