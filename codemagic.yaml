workflows:
  flutter-android:
    name: MOR FINAL BUILD
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
      java: 17
    scripts:
      - name: Create Android
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name megaoverflowradio --org com.megaoverflow
          
      - name: Generate Valid Launcher Icons from your PNG
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          ls -lh android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          
      - name: Fix Kotlin + Manifest + HTTP Stream
        script: |
          find android -name "*.gradle*" -type f -exec sed -i '' 's/1\.7\.10/1.9.22/g; s/1\.8\.10/1.9.22/g; s/1\.7\.1/1.9.22/g' {} \; 2>/dev/null || true
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          if "FOREGROUND_SERVICE" not in t:
              t = t.replace("<application", '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application')
          t = t.replace('android:usesCleartextTraffic="false"', 'android:usesCleartextTraffic="true"')
          if "usesCleartextTraffic" not in t:
              t = t.replace("<application", '<application android:usesCleartextTraffic="true"')
          if "APPLICATION_ID" not in t:
              t = t.replace("<application", '<application>\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n')
          t = t.replace("@mipmap/launcher_icon", "@mipmap/ic_launcher")
          p.write_text(t)
          print("Manifest ready for http://stream.radiojar.com/kks1y4wm7s8uv")
          PY

      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/*.apk