workflows:
  flutter-android:
    name: MOR BLACKSCREEN FIX
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
      java: 17
    scripts:
      - name: Create Android
        script: |
          rm -rf android
          flutter create. --platforms=android --project-name megaoverflowradio --org com.megaoverflow
          echo 'flutter_icons:
            android: true
            ios: false
            image_path: "assets/icon/app_icon.png"' > flutter_launcher_icons.yaml
      - name: Icons + Build
        script: |
          flutter pub get
          dart run flutter_launcher_icons || true
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t=p.read_text()
          t=t.replace('android:label="megaoverflowradio"', 'android:label="Mega Overflow Radio"')
          if 'Mega Overflow Radio' not in t:
            t=t.replace('<application', '<application android:label="Mega Overflow Radio"')
          t=t.replace('android:usesCleartextTraffic="false"', 'android:usesCleartextTraffic="true"')
          if 'usesCleartextTraffic' not in t:
            t=t.replace('<application', '<application android:usesCleartextTraffic="true"')
          t=t.replace('@mipmap/launcher_icon', '@mipmap/ic_launcher')
          p.write_text(t)
          PY
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk