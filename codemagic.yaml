workflows:
  flutter-android:
    name: MOR NAME LOGO STREAM FIX
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
      java: 17
    scripts:
      - name: Create Android
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name megaoverflowradio --org com.megaoverflow

      - name: Generate Icons + Fix Name
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          
          # FIX APP NAME from com.megaoverflow... to Mega Overflow Radio
          python3 << 'PY'
          import pathlib
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml").read_text()
          # Force label
          manifest = manifest.replace('android:label="megaoverflowradio"', 'android:label="Mega Overflow Radio"')
          manifest = manifest.replace('android:label="megaoverflow_radio"', 'android:label="Mega Overflow Radio"')
          # If no label, add it
          if 'Mega Overflow Radio' not in manifest:
              manifest = manifest.replace('<application', '<application android:label="Mega Overflow Radio"')
          # HTTP + Foreground + AdMob
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in manifest:
              manifest = manifest.replace("<application", '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application')
          manifest = manifest.replace('android:usesCleartextTraffic="false"', 'android:usesCleartextTraffic="true"')
          if "usesCleartextTraffic" not in manifest:
              manifest = manifest.replace("<application", '<application android:usesCleartextTraffic="true"')
          if "APPLICATION_ID" not in manifest:
              manifest = manifest.replace("<application", '<application>\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n')
          manifest = manifest.replace("@mipmap/launcher_icon", "@mipmap/ic_launcher")
          pathlib.Path("android/app/src/main/AndroidManifest.xml").write_text(manifest)
          print(manifest)
          PY
          
          # Fix Kotlin
          find android -name "*.gradle*" -type f -exec sed -i '' 's/1\.7\.10/1.9.22/g; s/1\.8\.10/1.9.22/g' {} \; 2>/dev/null || true

      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/*.apk