workflows:
  flutter-android:
    name: MOR Background + Bluetooth
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Verify Assets
        script: |
          echo "=== Checking assets ==="
          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: assets/icon/app_icon.png missing!"
            exit 1
          fi
          if [ ! -f assets/icon/logo.png ]; then
            echo "ERROR: assets/icon/logo.png missing!"
            exit 1
          fi
          ls -lh assets/icon/
          echo "=== Assets OK ==="

      - name: Regenerate Android + Write Manifest
        script: |
          rm -rf android
          flutter create . --platforms=android \
            --project-name megaoverflowradio \
            --org com.megaoverflow \
            --template app

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <!-- Network -->
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <!-- Background audio -->
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>

              <!-- Notifications (Android 13+) -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <!-- Bluetooth -->
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>

              <application
                  android:label="MegaOverflow Radio"
                  android:icon="@mipmap/launcher_icon"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- just_audio_background service -->
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService"/>
                      </intent-filter>
                  </service>

                  <!-- Media button receiver (Bluetooth / headset controls) -->
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON"/>
                      </intent-filter>
                  </receiver>

                  <!-- AdMob -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-1383337037822798~9185411751"/>

              </application>
          </manifest>
          XML

          echo "=== Manifest written ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Verify APK Contents
        script: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            exit 1
          fi

          echo "=== APK size ==="
          ls -lh "$APK"

          echo ""
          echo "=== Checking bundled assets ==="
          if unzip -l "$APK" | grep -i "assets/icon"; then
            echo "OK: icon assets bundled"
          else
            echo "ERROR: icon assets NOT bundled in APK"
            exit 1
          fi

          echo ""
          echo "=== Checking manifest strings ==="
          unzip -p "$APK" AndroidManifest.xml > /tmp/am.bin

          FAIL=0

          if strings /tmp/am.bin | grep -qi "audioservice"; then
            echo "OK: AudioService present"
          else
            echo "ERROR: AudioService NOT found in manifest"
            FAIL=1
          fi

          if strings /tmp/am.bin | grep -qi "MediaButtonReceiver"; then
            echo "OK: MediaButtonReceiver present"
          else
            echo "ERROR: MediaButtonReceiver NOT found in manifest"
            FAIL=1
          fi

          if strings /tmp/am.bin | grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK"; then
            echo "OK: FOREGROUND_SERVICE_MEDIA_PLAYBACK permission present"
          else
            echo "WARNING: FOREGROUND_SERVICE_MEDIA_PLAYBACK not found (Android 14+ may block background audio)"
          fi

          if strings /tmp/am.bin | grep -q "com.google.android.gms.ads.APPLICATION_ID"; then
            echo "OK: AdMob APPLICATION_ID present"
          else
            echo "ERROR: AdMob APPLICATION_ID NOT found"
            FAIL=1
          fi

          if strings /tmp/am.bin | grep -q "MegaOverflow Radio"; then
            echo "OK: App label present"
          else
            echo "WARNING: App label not found in manifest strings"
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "=== Verification FAILED ==="
            exit 1
          fi

          echo ""
          echo "=== All APK checks passed ==="

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
