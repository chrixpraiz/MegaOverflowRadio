workflows:
  flutter-android:
    name: MOR Flutter Full Fixed
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Recreate Android Folder (Fix v1 embedding)
        script: |
          # Delete old broken android folder
          rm -rf android
          flutter create . --platforms=android --project-name megaoverflowradio --org com.megaoverflow

      - name: Add Permissions & Build
        script: |
          python3 << 'PY'
          import pathlib
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text()
          if "INTERNET" not in t:
            t = t.replace("<application", '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application')
          if "usesCleartextTraffic" not in t:
            t = t.replace("<application", '    <application android:usesCleartextTraffic="true" ')
          m.write_text(t)
          print("Manifest fixed with INTERNET + cleartext")
          PY
          flutter pub get
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
