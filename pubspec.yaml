name: megaoverflowradio
description: Mega Overflow Radio
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.23
  audio_service: ^0.18.14
  http: ^1.1.2
  url_launcher: ^6.2.5
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/logo.png