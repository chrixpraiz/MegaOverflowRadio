name: megaoverflowradio
description: Mega Overflow Radio
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.23
  audio_service: ^0.18.14
  http: ^1.2.2
  url_launcher: ^6.2.5
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/logo.png